<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Alex Bramwell" />
    <meta name="description" content="Spots Project." />
    <meta name="keywords" content="HTML, CSS" />
    <link rel="icon" href="../src/Vendor/favicon.ico" />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img class="header__logo"
        src="<%=require('./src/images/logo.svg')%>" alt="Around the U.S. Logo" />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
          <button type="button" class="profile__avatar-edit-btn">
            <img class="profile__avatar-edit-icon"
            src="<%=require('./src/images/edit_avatar-pencil.svg')%>" alt="Edit Avatar" />
          </button>
          <img class="profile__avatar"
          src="<%=require('./src/images/avatar.jpg')%>" alt="Profile Avatar" />
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit">
              <img class="profile__edit-icon"
              src="<%=require('./src/images/pen_icon.svg')%>" alt="Edit Profile"" />
              <span class="profile__edit-text">Edit profile</span>
            </button>
          </div>
          <button type="button" class="profile__add">
            <img class="profile__post-button"
            src="<%=require('./src/images/post_button.svg')%>" alt="Add Post" />
            <span class="profile__post-text">Add post</span>
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card__template">
              <li class="card">
                <img src="" alt=" " class="card__image" />
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button type="button" class="card__like-button"></button>
                  <button type="button" class="card__delete-button"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__text">2025 &copy; Alex Bramwell</p>
      </footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__content">
          <button class="modal__close-button" type="button">
            <img class="modal__close-button-image"
            src="<%=require('./src/images/X_button.svg')%>" alt="Close Modal"" />
          </button>
          <h2 class="modal__title">Edit profile</h2>
          <form class="modal__form">
            <label for="modal__name-input" class="modal__label"
              >Name
              <input
                required
                minlength="2"
                maxlength="40"
                type="text"
                id="modal__name-input"
                class="modal__input"
                placeholder="Type your name"
              />
              <span
                id="modal__name-input-error"
                class="modal__input-error"
              ></span>
            </label>
            <label for="modal__description-input" class="modal__label"
              >Description
              <input
                required
                minlength="2"
                maxlength="200"
                type="text"
                id="modal__description-input"
                class="modal__input"
                placeholder="Describe yourself"
              />
              <span
                id="modal__description-input-error"
                class="modal__input-error"
              ></span>
            </label>
            <button class="modal__submit-button"
            src="<%=require('./src/images/post_button.svg')%>" alt="Add Post"" type="submit">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="new-post-modal">
        <div class="modal__content">
          <button class="modal__close-button" type="button">
            <img class="modal__close-button-image2"
            src="<%=require('./src/images/X_button.svg')%>" alt="Close Modal" />
          </button>
          <h2 class="modal__title">New post</h2>
          <form class="modal__form">
            <label for="card-image-input" class="modal__label"
              >Image link
              <input
                required
                type="url"
                id="card-image-input"
                class="modal__input"
                placeholder="Paste a link to the picture"
              />
              <span
                id="card-image-input-error"
                class="modal__input-error"
              ></span>
            </label>
            <label for="card-caption-input" class="modal__label"
              >Caption
              <input
                required
                minlength="2"
                maxlength="30"
                type="text"
                id="card-caption-input"
                class="modal__input"
                placeholder="Type your caption"
              />
              <span
                id="card-caption-input-error"
                class="modal__input-error"
              ></span>
            </label>
            <button class="modal__submit-button" type="submit"
             src="<%=require('./src/images/post_button.svg')%>" alt="Add Post">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="preview-image-modal">
        <div class="modal__image-container">
          <button class="modal__close-button-preview" type="button">
            <img class="modal__close-button-previewLogo"
            src="<%=require('./src/images/X-button-white.svg')%>" alt="Close Modal" />
          </button>
          <img src="#" alt=" " class="modal__image" />
          <p class="modal__caption">#</p>
        </div>
      </div>
    </div>
    <div class="modal" id="edit-avatar-modal">
        <div class="modal__content">
          <button class="modal__close-button" type="button" id="close-edit-avatar-button">
            <img class="modal__close-button-image2"
            src="<%=require('./src/images/X_button.svg')%>" alt="Close Modal" />
          </button>
          <h3 class="modal__title">Edit Avatar</h3>
          <form class="modal__form" id="edit-avatar-form">
            <label for="avatar-image-input" class="modal__label">
              Avatar
              <input
                required
                type="url"
                id="avatar-image-input"
                class="modal__input"
                placeholder="Avatar URL Goes Here"
              />
              <span
                id="avatar-image-input-error"
                class="modal__input-error"
              ></span>
            </label>
             <button class="modal__submit-button" id="submitAvatar" type="submit"
             src="<%=require('./src/images/post_button.svg')%>" alt="Add Post">Save</button>
          </form>
        </div>
      </div>
    </div>
    <div class="modal" id="modal__delete-image">
        <div class="modal__content modal__delete-content">
          <h3 class="modal__title modal__delete-title">Are you sure you want to delete this image?</h3>
          <form class="modal__delete-form" id="modal__delete-form">
             <button class="modal__save_delete-button" type="submit" id="modal__save_delete-button">
              Delete
             </button>
             <button class="modal__cancel_delete-button" id="cancelDelete" type="button">
              Cancel
              </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
